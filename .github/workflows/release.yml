name: Release

# Push a tag like `v0.1.0` on `main` to publish. Both packages are published
# from a single job, in order, because @askdepth/audience-connector depends on a
# pinned exact version of @askdepth/audience-contract that must already resolve
# on the registry.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm provenance (see PROVENANCE note below)

jobs:
  publish:
    runs-on: ubuntu-latest

    # The connector's S6 suite refuses to skip when CI is set, so the release
    # job needs a Postgres just like ci.yml's workspace job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: connector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/connector_test

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }

      - run: pnpm install --frozen-lockfile

      # Build + verify BOTH packages before publishing either one.
      - run: pnpm --filter @askdepth/audience-contract  build
      - run: pnpm --filter @askdepth/audience-contract  typecheck
      - run: pnpm --filter @askdepth/audience-contract  test
      - run: pnpm --filter @askdepth/audience-connector build
      - run: pnpm --filter @askdepth/audience-connector typecheck
      - run: pnpm --filter @askdepth/audience-connector test

      # 1. Contract first.
      - name: Publish @askdepth/audience-contract
        run: pnpm --filter @askdepth/audience-contract publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Requires this repo to be public (provenance links to public source)
          # and `id-token: write` on the job (set above).
          NPM_CONFIG_PROVENANCE: 'true'

      # 2. Do not publish the connector until the contract version it pins is
      #    actually visible on the registry (npm is not read-your-writes).
      - name: Wait for the contract on the registry
        run: |
          VERSION=$(node -p "require('./packages/contract/package.json').version")
          echo "waiting for @askdepth/audience-contract@$VERSION ..."
          for i in $(seq 1 30); do
            if npm view "@askdepth/audience-contract@$VERSION" version >/dev/null 2>&1; then
              echo "visible after attempt $i"
              exit 0
            fi
            sleep 10
          done
          echo "::error::@askdepth/audience-contract@$VERSION not on registry after 5 min"
          exit 1

      # 3. Connector second.
      - name: Publish @askdepth/audience-connector
        run: pnpm --filter @askdepth/audience-connector publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
