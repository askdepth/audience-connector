name: Release

# Changesets release loop on `main`:
# 1. Pending `.changeset/*.md` → open/update PR "chore(release): version packages"
# 2. That PR is merged → no pending changesets, package.json ahead of npm → publish
#
# Do not publish from a laptop — provenance is tied to this workflow's OIDC token.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest

    # Full verify before version PR or publish. The connector's S6 suite refuses
    # to skip when CI is set, so this job needs Postgres like ci.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: connector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/connector_test

    steps:
      - uses: actions/checkout@v7
        with:
          # changesets needs full history for accurate changelogs / bumps
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with: { version: 9 }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Build + verify BOTH publishable packages before opening a version PR
      # or publishing either one.
      - run: pnpm --filter @askdepth/audience-contract  build
      - run: pnpm --filter @askdepth/audience-contract  typecheck
      - run: pnpm --filter @askdepth/audience-contract  test
      - run: pnpm --filter @askdepth/audience-connector build
      - run: pnpm --filter @askdepth/audience-connector typecheck
      - run: pnpm --filter @askdepth/audience-connector test

      - name: Create Version PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Requires a public repo (provenance links to public source) and
          # `id-token: write` on the job (set above).
          NPM_CONFIG_PROVENANCE: 'true'
